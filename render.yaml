# render.yaml - Complete configuration for Shopify AI Analytics App
services:
  # 1. Main API Gateway (FastAPI - Rails compatible)
  - type: web
    name: shopify-ai-main-api
    runtime: python
    rootDir: main_api
    region: oregon  # or singapore, frankfurt, ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 8000
      - key: AGENT_SERVICE_URL
        value: https://shopify-ai-agent.onrender.com
      - key: MOCK_SERVICE_URL  
        value: https://shopify-ai-mock-api.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1

  # 2. AI Agent Service (OpenAI integration)
  - type: web
    name: shopify-ai-agent
    runtime: python
    rootDir: ai_agent/agent
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      pip install gunicorn
    startCommand: gunicorn agent:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PORT
        value: 8001
      - key: OPENAI_API_KEY
        sync: false  # You'll enter this manually in Render dashboard
      - key: API_GATEWAY_URL
        value: https://shopify-ai-main-api.onrender.com
      - key: MOCK_API_URL
        value: https://shopify-ai-mock-api.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
    autoDeploy: true

  # 3. Mock Shopify API Service
  - type: web
    name: shopify-ai-mock-api
    runtime: python
    rootDir: mock_shopify
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python shopify_mock.py
    envVars:
      - key: PORT
        value: 8002
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        value: "*"  # Allow all origins for development
    healthCheckPath: /health
    autoDeploy: true

  # 4. Frontend Static Site
  - type: static
    name: shopify-ai-frontend
    rootDir: frontend
    buildCommand: |
      echo "Building frontend..."
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    envVars:
      - key: API_BASE_URL
        value: https://shopify-ai-main-api.onrender.com
        